name: Nhom 10 - Week 1 CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  week1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Make Maven Wrapper executable
        run: chmod +x mvnw
      - name: Build and test week 1 baseline
        run: ./mvnw -B -pl common,server,client -am clean verify
