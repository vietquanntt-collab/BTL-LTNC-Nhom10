name: Nhom 10 - CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

jobs:
  build-test-package:
    name: Build, Test, Quality & Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Quality Gate - Repository & Structure Check
        run: |
          if git ls-files '*.db' '*.db-wal' '*.db-shm' | grep -q .; then
            echo "ERROR: Runtime SQLite database files must not be tracked in Git."
            exit 1
          fi
          test -d database/migrations || (echo "ERROR: database/migrations missing" && exit 1)
          test -f README.md || (echo "ERROR: README.md missing" && exit 1)

      - name: Build & Compile All Modules
        run: ./mvnw -B clean test-compile

      - name: Run Full Regression Tests
        run: ./mvnw -B test

      - name: Package Artifacts
        run: ./mvnw -B package -DskipTests

      - name: Assemble Release Bundle
        run: |
          mkdir -p release-bundle/jars release-bundle/docs
          find common/target server/target client/target -maxdepth 1 -name '*.jar' ! -name 'original-*.jar' -exec cp {} release-bundle/jars/ \;
          cp -r database release-bundle/
          cp -r scripts release-bundle/
          cp README.md release-bundle/
          cp -r docs/* release-bundle/docs/ 2>/dev/null || true
          ls -la release-bundle/jars

      - name: Upload Surefire Test Reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: surefire-test-reports
          path: |
            **/target/surefire-reports/*.xml
            **/target/surefire-reports/*.txt

      - name: Upload Release Package Artifact
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: nhom10-online-auction-release
          path: release-bundle/